        details: Python, SQL, Java, C, TypeScript
      - label: Data and Backend
        details: FastAPI, SQLAlchemy, PostgreSQL, MySQL, OpenCV, scikit-image, Orange3, Streamlit
      - label: DevOps and Tools
        details: Linux, Docker, Docker Compose, Caddy, Git, Bash
      - label: Security
        details: Web and network security, penetration testing (PTES, OWASP Top 10), binary exploitation, GDB
      - label: Currently Learning
        details: Kubernetes, cloud-init, virtual machine provisioning, Rust
    About Me:
      - I am a third-year computer science student at the University of Ljubljana with a long-standing interest in programming. I started programming in secondary school, where I first worked with Python, and I have used it ever since. At university I added Java, TypeScript and C.
      - I work as a data scientist at Knauf Insulation, where I build Python tools for data and image analysis. I also develop backend services and command-line utilities.
      - In my free time I keep improving my skills through personal projects, from web apps to command-line tools that streamline my workflow. Outside programming, I enjoy climbing and board games.

