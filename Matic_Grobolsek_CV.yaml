        highlights:
          - Syncs views into new migrations and tests them on a disposable MySQL instance
      - name: '[Web Application Penetration Test](https://grobolsek.com/assets/VarProg_Grobol%C5%A1ek_Tinauer-BwV06_Ye.pdf)'
        date:
        start_date:
        end_date:
        location:
        summary: co-authored white-box test (PTES, OWASP Top 10)
        highlights:
          - Found a critical CWE-319 flaw (credentials sent over plain HTTP); no SQLi or XSS
      - name: '[TINR](https://github.com/grobolsek/TINR)'
        date:
        start_date:
        end_date:
        location:
